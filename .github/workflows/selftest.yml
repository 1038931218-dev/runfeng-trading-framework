name: selftest
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy empyrical-reloaded quantstats arch baostock || true
      - name: Run self-test (73+ checks, no network needed)
        run: python3 tools/selftest.py
